<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
        initial-scale=1.0,
        maximum-scale=1.0,
        user-scalable=no"
    >

    <title>追上红哥就打</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="game">

    <!-- 顶部信息 -->
    <div class="top-bar">

        <div class="title">
            🥊 追上红哥就打
        </div>

        <div class="score">
            得分：
            <span id="score">0</span>
        </div>

    </div>


    <!-- 游戏画面 -->
    <canvas id="gameCanvas"></canvas>


    <!-- 命中提示 -->
    <div id="message">
        💥 打中了！ +1
    </div>


    <!-- 开始游戏 -->
    <button id="startButton">
        开始游戏
    </button>


    <!-- 手机虚拟摇杆 -->
    <div
        id="joystick"
        class="joystick"
    >

        <div
            id="joystickKnob"
            class="joystick-knob"
        ></div>

    </div>


    <!-- 手机攻击按钮 -->
    <button
        id="attackButton"
        class="attack-button"
        type="button"
    >
        👊
    </button>

</div>


<script src="game.js"></script>

</body>

</html>
